<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Tiệm Phở Gabros</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="stylesheet" href="TemplateData/style.css" />

    <style>
     #unity-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
}

canvas#unity-canvas {
  width: 100%;
  height: 100%;
  max-height: 100vh;
  max-width: calc(100vh * 9 / 16); /* giới hạn theo tỉ lệ 9:16 */
  margin: 0 auto;
  display: block;
}
    </style>
  </head>

  <body class="dark">
    <div id="unity-container" class="unity-mobile">
      <canvas id="unity-canvas"></canvas>
    </div>

    <div id="loading-cover" style="display: none;">
      <div id="unity-loading-bar">
        <div id="unity-progress-bar-empty" style="display: none;">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div class="spinner"></div>
      </div>
    </div>

    <div id="unity-fullscreen-button" style="display: none;"></div>

    <script>
      const hideFullScreenButton = "";
      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/BuildGab012.loader.js";
      const config = {
        dataUrl: buildUrl + "/BuildGab012.data",
        frameworkUrl: buildUrl + "/BuildGab012.framework.js",
        codeUrl: buildUrl + "/BuildGab012.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Gabros",
        productName: "Tiệm Phở Gabros",
        productVersion: "2.6.6",
      };

      const container = document.querySelector("#unity-container");
      const canvas = document.querySelector("#unity-canvas");
      const loadingCover = document.querySelector("#loading-cover");
      const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
      const progressBarFull = document.querySelector("#unity-progress-bar-full");
      const fullscreenButton = document.querySelector("#unity-fullscreen-button");
      const spinner = document.querySelector(".spinner");

      const canFullscreen = (function () {
        for (const key of [
          "exitFullscreen",
          "webkitExitFullscreen",
          "webkitCancelFullScreen",
          "mozCancelFullScreen",
          "msExitFullscreen",
        ]) {
          if (key in document) {
            return true;
          }
        }
        return false;
      })();

      // Set devicePixelRatio lower to reduce memory on iPhone
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        config.devicePixelRatio = 1.5; // hoặc 1.0 nếu vẫn bị reload
      }

      loadingCover.style.display = "";

      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          spinner.style.display = "none";
          progressBarEmpty.style.display = "";
          progressBarFull.style.width = `${100 * progress}%`;
        })
          .then((unityInstance) => {
            loadingCover.style.display = "none";

            if (canFullscreen && !hideFullScreenButton) {
              fullscreenButton.style.display = "";
              fullscreenButton.onclick = () => {
                unityInstance.SetFullscreen(1);
              };
            }
          })
          .catch((message) => {
            console.error("Unity load error:", message);
          });
      };
      document.body.appendChild(script);
    </script>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </body>
</html>
